<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Bacha Hua Khana icon sprite. Use: <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#mic"/></svg>
       24px grid, 2px stroke in currentColor. The veg / non-veg marks keep their own colours. -->

  <symbol id="mic" viewBox="0 0 24 24">
    <rect x="9" y="2.5" width="6" height="11.5" rx="3"/>
    <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
    <path d="M12 17.5V21.5M8.5 21.5h7"/>
  </symbol>

  <symbol id="stop" viewBox="0 0 24 24">
    <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
  </symbol>

  <symbol id="play" viewBox="0 0 24 24">
    <path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>
  </symbol>

  <symbol id="check" viewBox="0 0 24 24">
    <path d="M4.5 12.5l5 5L19.5 7"/>
  </symbol>

  <symbol id="cross" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>

  <symbol id="clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5l3.5 2"/>
  </symbol>

  <symbol id="pin" viewBox="0 0 24 24">
    <path d="M12 21.5s6.5-5.8 6.5-11.5a6.5 6.5 0 0 0-13 0c0 5.7 6.5 11.5 6.5 11.5z"/>
    <circle cx="12" cy="10" r="2.5"/>
  </symbol>

  <symbol id="phone" viewBox="0 0 24 24">
    <path d="M6.6 3h2.6l1.6 4.2-2.1 1.5a11 11 0 0 0 5.6 5.6l1.5-2.1 4.2 1.6v2.6A2.6 2.6 0 0 1 17.4 19 14.4 14.4 0 0 1 4 5.6 2.6 2.6 0 0 1 6.6 3z"/>
  </symbol>

  <!-- a scooter: the volunteer's ride (rear body over the back wheel, low floor, steering column) -->
  <symbol id="bike" viewBox="0 0 24 24">
    <circle cx="5.5" cy="17.5" r="2.5"/>
    <circle cx="18.5" cy="17.5" r="2.5"/>
    <path d="M3 16a5 5 0 0 1 5-5h3.5l2.5 6.5H8"/>
    <path d="M6.5 8.5h5"/>
    <path d="M14 17.5L17.2 6M15.4 6h4"/>
  </symbol>

  <!-- veg: green square, green dot (the standard Indian food mark) -->
  <symbol id="veg" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="2" fill="#FFFFFF" stroke="#1E5631" stroke-width="2"/>
    <circle cx="12" cy="12" r="5" fill="#1E5631" stroke="none"/>
  </symbol>

  <!-- non-veg: square with a filled triangle, in mirchi -->
  <symbol id="non-veg" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="2" fill="#FFFFFF" stroke="#C62E1F" stroke-width="2"/>
    <path d="M12 6.8l5.6 9.7H6.4z" fill="#C62E1F" stroke="none"/>
  </symbol>

  <symbol id="people" viewBox="0 0 24 24">
    <circle cx="9" cy="8" r="3.2"/>
    <path d="M3 20c0-3.4 2.7-6 6-6s6 2.6 6 6"/>
    <circle cx="17" cy="9" r="2.5"/>
    <path d="M16.2 14.1c2.8.3 4.8 2.6 4.8 5.9"/>
  </symbol>

  <symbol id="flame" viewBox="0 0 24 24">
    <path d="M12 21.5c3.9 0 6.5-2.7 6.5-6.3 0-3.6-2.4-5.6-3.7-8-.5 1.9-1.5 3-2.6 3.4.1-3.1-1.2-6.3-3.7-8.1.2 3.8-3.5 6.6-3.5 11 0 4.6 3 8 7 8z"/>
  </symbol>

  <symbol id="chevron-down" viewBox="0 0 24 24">
    <path d="M6 9l6 6 6-6"/>
  </symbol>

  <symbol id="speaker" viewBox="0 0 24 24">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
  </symbol>

  <!-- covered food: a pot with its lid on -->
  <symbol id="covered" viewBox="0 0 24 24">
    <path d="M3.5 11.5h17"/>
    <path d="M5.5 11.5a6.5 4.5 0 0 1 13 0"/>
    <path d="M12 7V5M10.5 5h3"/>
    <path d="M5.5 11.5v5A3.5 3.5 0 0 0 9 20h6a3.5 3.5 0 0 0 3.5-3.5v-5"/>
  </symbol>
</svg>
