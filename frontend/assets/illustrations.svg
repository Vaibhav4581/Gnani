<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Bacha Hua Khana illustrations (see DESIGN.md): flat, 2-3 palette colours each, 2px round
       strokes. Colours are the design tokens (CSS variables), with the hex as a fallback.
       Use only in the home hero, empty states and the volunteer's "no rescues yet" state. -->

  <symbol id="banana-leaf" viewBox="0 0 240 140">
    <path d="M10 92 C 34 30, 152 2, 232 38 C 214 98, 118 140, 10 92 Z" style="fill:var(--leaf,#1E5631);stroke:var(--leaf-deep,#143D23)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 80 L64 54 M44 80 L66 104" style="fill:none;stroke:var(--leaf-deep,#143D23)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M74 72 L94 42 M74 72 L98 108" style="fill:none;stroke:var(--leaf-deep,#143D23)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M104 64 L126 32 M104 64 L130 104" style="fill:none;stroke:var(--leaf-deep,#143D23)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M134 57 L156 26 M134 57 L160 94" style="fill:none;stroke:var(--leaf-deep,#143D23)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M164 50 L184 28 M164 50 L188 80" style="fill:none;stroke:var(--leaf-deep,#143D23)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M192 44 L208 30 M192 44 L212 62" style="fill:none;stroke:var(--leaf-deep,#143D23)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    <path d="M12 91 C 82 72, 160 50, 230 39" style="fill:none;stroke:var(--leaf-deep,#143D23)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 91 L2 96" style="fill:none;stroke:var(--leaf-deep,#143D23)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- The same leaf standing upright, for a slip to lie on (the home hero). -->
  <symbol id="banana-leaf-tall" viewBox="0 0 140 240">
    <use href="#banana-leaf" width="240" height="140" transform="translate(140 0) rotate(90)"/>
  </symbol>

  <symbol id="tiffin" viewBox="0 0 64 100">
    <path d="M20 22 C 20 6, 44 6, 44 22" style="fill:none;stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="12" y="20" width="40" height="8" rx="4" style="fill:var(--counter-edge,#C3C9CE);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="8" y="30" width="48" height="20" rx="5" style="fill:var(--counter,#E9ECEA);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="8" y="52" width="48" height="20" rx="5" style="fill:var(--counter,#E9ECEA);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="8" y="74" width="48" height="20" rx="5" style="fill:var(--counter,#E9ECEA);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 26 V96 M59 26 V96" style="fill:none;stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 37 H24 M15 59 H24 M15 81 H24" style="fill:none;stroke:var(--paper,#FFFFFF)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="scooter" viewBox="0 0 140 92">
    <rect x="12" y="18" width="34" height="28" rx="4" style="fill:var(--haldi,#F2A900);stroke:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 28 H46 M24 46 V52 H52" style="fill:none;stroke:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 72 C 40 56, 52 48, 66 48 H92 C 102 48, 106 58, 100 70 L96 72 Z" style="fill:var(--leaf,#1E5631);stroke:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="40" width="30" height="8" rx="4" style="fill:var(--ink,#17261C);stroke:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98 70 L112 32 M112 32 L104 24 M112 32 L124 27" style="fill:none;stroke:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="121" cy="38" r="3" style="fill:var(--haldi,#F2A900);stroke:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="74" r="13" style="fill:var(--counter,#E9ECEA);stroke:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="74" r="13" style="fill:var(--counter,#E9ECEA);stroke:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="74" r="4" style="fill:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="74" r="4" style="fill:var(--ink,#17261C)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="shelter" viewBox="0 0 110 92">
    <path d="M4 88 H106" style="fill:none;stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="42" width="74" height="46" style="fill:var(--paper,#FFFFFF);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 46 L55 10 L100 46 Z" style="fill:var(--leaf,#1E5631);stroke:var(--leaf-deep,#143D23)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="60" width="18" height="28" rx="2" style="fill:var(--haldi,#F2A900);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="26" y="56" width="12" height="12" rx="1" style="fill:var(--leaf-soft,#E3EFE4);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="56" width="12" height="12" rx="1" style="fill:var(--leaf-soft,#E3EFE4);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="thali" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" style="fill:var(--counter,#E9ECEA);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="37" style="fill:none;stroke:var(--counter-edge,#C3C9CE)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="42" cy="64" rx="15" ry="10" style="fill:var(--paper,#FFFFFF);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="36" r="10" style="fill:var(--haldi-soft,#FFF4D6);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="61" cy="30" r="9" style="fill:var(--mirchi-soft,#FBE6E3);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="68" cy="58" r="10" style="fill:var(--leaf-soft,#E3EFE4);stroke:var(--steel-dark,#5F6A74)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Pulli kolam: loops woven round a 5 x 5 grid of dots. Drawn in currentColor, used faint. -->
  <symbol id="kolam" viewBox="0 0 120 120">
    <circle cx="12" cy="12" r="2" style="fill:currentColor"/><circle cx="12" cy="36" r="2" style="fill:currentColor"/><circle cx="12" cy="60" r="2" style="fill:currentColor"/><circle cx="12" cy="84" r="2" style="fill:currentColor"/><circle cx="12" cy="108" r="2" style="fill:currentColor"/><circle cx="36" cy="12" r="2" style="fill:currentColor"/><circle cx="36" cy="36" r="2" style="fill:currentColor"/><circle cx="36" cy="60" r="2" style="fill:currentColor"/><circle cx="36" cy="84" r="2" style="fill:currentColor"/><circle cx="36" cy="108" r="2" style="fill:currentColor"/><circle cx="60" cy="12" r="2" style="fill:currentColor"/><circle cx="60" cy="36" r="2" style="fill:currentColor"/><circle cx="60" cy="60" r="2" style="fill:currentColor"/><circle cx="60" cy="84" r="2" style="fill:currentColor"/><circle cx="60" cy="108" r="2" style="fill:currentColor"/><circle cx="84" cy="12" r="2" style="fill:currentColor"/><circle cx="84" cy="36" r="2" style="fill:currentColor"/><circle cx="84" cy="60" r="2" style="fill:currentColor"/><circle cx="84" cy="84" r="2" style="fill:currentColor"/><circle cx="84" cy="108" r="2" style="fill:currentColor"/><circle cx="108" cy="12" r="2" style="fill:currentColor"/><circle cx="108" cy="36" r="2" style="fill:currentColor"/><circle cx="108" cy="60" r="2" style="fill:currentColor"/><circle cx="108" cy="84" r="2" style="fill:currentColor"/><circle cx="108" cy="108" r="2" style="fill:currentColor"/>
    <path d="M36 24 Q48 24 48 36 Q48 48 36 48 Q24 48 24 36 Q24 24 36 24 Z M36 48 Q48 48 48 60 Q48 72 36 72 Q24 72 24 60 Q24 48 36 48 Z M36 72 Q48 72 48 84 Q48 96 36 96 Q24 96 24 84 Q24 72 36 72 Z M60 24 Q72 24 72 36 Q72 48 60 48 Q48 48 48 36 Q48 24 60 24 Z M60 48 Q72 48 72 60 Q72 72 60 72 Q48 72 48 60 Q48 48 60 48 Z M60 72 Q72 72 72 84 Q72 96 60 96 Q48 96 48 84 Q48 72 60 72 Z M84 24 Q96 24 96 36 Q96 48 84 48 Q72 48 72 36 Q72 24 84 24 Z M84 48 Q96 48 96 60 Q96 72 84 72 Q72 72 72 60 Q72 48 84 48 Z M84 72 Q96 72 96 84 Q96 96 84 96 Q72 96 72 84 Q72 72 84 72 Z" style="fill:none;stroke:currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="4" y="4" width="112" height="112" rx="34" style="fill:none;stroke:currentColor" stroke-width="1.5"/>
  </symbol>
</svg>
